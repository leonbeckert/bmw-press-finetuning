model:
  name: Qwen/Qwen3-0.6B
  torch_dtype: bfloat16

training:
  output_dir: runs/base
  max_seq_length: 1024
  packing: true
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  seed: 42

data:
  train_path: data/processed/train.jsonl
  eval_path: data/processed/eval.jsonl

mlflow:
  experiment_name: bmw-press-finetuning

evaluation:
  sample_prompts:
    - "BMW's electrification strategy focuses on"
    - "The key features of the new BMW iX include"
    - "BMW Group reported in 2025 that"
    - "The MINI Cooper Electric offers"
    - "BMW M GmbH develops high-performance vehicles that"
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  num_latency_runs: 5
