[project]
name = "bmw-press-finetuning"
version = "0.1.0"
description = "Fine-tuning a small language model on BMW press releases"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]
train = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57,<5.0",
    "trl>=0.28",
    "datasets>=3.5,<4",
    "accelerate>=1.12",
    "mlflow>=2.22",
    "pyyaml>=6.0",
    "nvidia-ml-py>=12.0",
    "psutil>=6.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
